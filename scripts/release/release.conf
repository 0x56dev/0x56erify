# shellcheck shell=bash
# Fixed release identity for 0x56erify GitHub releases. Sourced by the release
# scripts; every value here is public. Changing any of them is a deliberate,
# reviewed change - in particular SIGNING_CERT_SHA256 must never change, since
# both GitHub upgrades and F-Droid's reproducible-build verification
# (AllowedAPKSigningKeys) depend on it.

REPO="0x56dev/0x56erify"
APP_NAME="0x56erify"
PACKAGE_NAME="dev.x56.verify"

# SHA-256 of the release signing certificate used for every release so far
# (v0.1.0 - v0.1.3), CN=0x56erify.
SIGNING_CERT_SHA256="0e454cec0c016fb821b817ebcc2aa48ddf7c0efe1f468d905b140400b3a26c3d"

# Android build-tools used for aapt2/apksigner/zipalign checks, locally and in CI.
# (Release signing itself is done by AGP inside the Gradle build.)
BUILD_TOOLS_VERSION="35.0.0"

# Every permission the APK may declare or request. Anything else fails the
# release checks; INTERNET is additionally called out explicitly.
ALLOWED_PERMISSIONS=(
  "dev.x56.verify.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
)
FORBIDDEN_PERMISSIONS=(
  "android.permission.INTERNET"
)

GRADLE_FILE="app/build.gradle.kts"
CHANGELOG_DIR="fastlane/metadata/android/en-US/changelogs"
NOTES_DIR=".github/release-notes"
RELEASE_WORKFLOW_PATH=".github/workflows/release.yml"
UNSIGNED_APK_GRADLE_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
TEST_RESULTS_DIR="app/build/test-results/testReleaseUnitTest"
